# Cloud Build config for CI (GitHub Actions).
#
# Uses CLOUD_LOGGING_ONLY so the build does NOT write to the default GCS logs
# bucket. When `gcloud builds submit` is invoked by a service-account identity
# (Workload Identity Federation), it cannot stream logs from the default bucket
# and errors out with "This tool can only stream logs if you are Viewer/Owner"
# even though the build itself succeeds. Routing logs to Cloud Logging avoids
# that entirely and lets gcloud poll build status normally.
#
# Invoked as:
#   gcloud builds submit --config cloudbuild.yaml --substitutions=_IMAGE=<image> .
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}", "."]
images:
  - "${_IMAGE}"
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _IMAGE: "" # provided at submit time
